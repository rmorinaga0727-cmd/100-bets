<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>営業日報フォーマッター</title><meta name="description" content="数字と課題を入れるだけで、読みやすい営業日報の骨子を作ります。"><style>:root{--bg:#0f1115;--card:#171a21;--line:#2b303b;--text:#f5f7fa;--sub:#aeb6c2;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:42px 20px 70px}.eyebrow{color:var(--sub);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;margin:12px 0 18px}.lead{font-size:18px;color:var(--sub);max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button,.btn{display:inline-block;background:var(--accent);color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.result{white-space:pre-wrap;background:#0b0d11;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;min-height:56px}.price{font-size:34px;font-weight:800}.muted{color:var(--sub)}a{color:inherit}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:14px;margin-top:24px}.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}.item:hover{transform:translateY(-1px)}</style></head>
<body data-bet="004"><div class="wrap">
<div class="topnav"><a href="../index.html">← 100 BETS</a><span class="eyebrow">BET #004</span></div>
<h1>営業日報フォーマッター</h1><p class="lead">数字と課題を入れるだけで、読みやすい営業日報の骨子を作ります。</p>
<div class="card"><div class="eyebrow">TARGET</div><h2>営業担当者</h2><p class="muted">日報作成に毎日時間がかかる</p></div>
<div class="card"><div class="eyebrow">FREE TOOL</div><h2>まず無料で試す</h2><div class="grid">
<div class="field"><label>本日の架電数</label><input id="calls" value="180"></div>
<div class="field"><label>本日のアポ数</label><input id="apps" value="3"></div></div>
<div class="field"><label>良かった点</label><textarea id="good">有効会話からの切り返しが改善</textarea></div>
<div class="field"><label>課題</label><textarea id="issue">再コール対象の取りこぼし</textarea></div>
<button onclick="run()">日報を作る</button><div id="r" class="result"></div>
<script>function run(){r.textContent="【本日の実績】\n架電："+calls.value+"件\nアポ："+apps.value+"件\n\n【Good】\n"+good.value+"\n\n【課題】\n"+issue.value+"\n\n【Next Action】\n明日は課題を1つに絞り、同じ指標で再検証する。";}</script></div>
<div class="card"><div class="eyebrow">PAID PRODUCT</div><h2>営業日報テンプレート集</h2><div class="price">¥1,480</div>
<p class="muted">V0.1では販売導線のみ。決済は次フェーズで接続します。</p><a class="btn" href="mailto:?subject=営業日報テンプレート集について">興味あり</a></div>
<div class="card"><div class="eyebrow">ARTICLE IDEA</div><h2>営業日報は5項目だけでいい</h2><p class="muted">このテーマからSEO記事・note記事を派生させる予定。</p></div>
</div><script src="../tracking.js"></script></body></html>

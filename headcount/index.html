<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>営業必要人員計算ツール</title><meta name="description" content="目標売上と1人あたり生産性から必要人員を試算します。"><style>:root{--bg:#0f1115;--card:#171a21;--line:#2b303b;--text:#f5f7fa;--sub:#aeb6c2;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:42px 20px 70px}.eyebrow{color:var(--sub);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;margin:12px 0 18px}.lead{font-size:18px;color:var(--sub);max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button,.btn{display:inline-block;background:var(--accent);color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.result{white-space:pre-wrap;background:#0b0d11;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;min-height:56px}.price{font-size:34px;font-weight:800}.muted{color:var(--sub)}a{color:inherit}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:14px;margin-top:24px}.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}.item:hover{transform:translateY(-1px)}</style></head>
<body><div class="wrap">
<div class="topnav"><a href="../index.html">← 100 BETS</a><span class="eyebrow">BET #009</span></div>
<h1>営業必要人員計算ツール</h1><p class="lead">目標売上と1人あたり生産性から必要人員を試算します。</p>
<div class="card"><div class="eyebrow">TARGET</div><h2>事業責任者</h2><p class="muted">目標売上に何人必要か感覚で採用している</p></div>
<div class="card"><div class="eyebrow">FREE TOOL</div><h2>まず無料で試す</h2><div class="grid"><div class="field"><label>月間売上目標 円</label><input id="g" type="number" value="10000000"></div><div class="field"><label>1人あたり月間売上 円</label><input id="p" type="number" value="1500000"></div></div>
<button onclick="run()">計算する</button><div id="r" class="result"></div>
<script>function run(){let h=+p.value?Math.ceil(+g.value/+p.value):0;r.textContent="必要営業人員：約 "+h+" 名\n※立ち上がり期間・欠勤・管理工数は別途バッファ推奨";}</script></div>
<div class="card"><div class="eyebrow">PAID PRODUCT</div><h2>営業組織設計シート</h2><div class="price">¥3,980</div>
<p class="muted">V0.1では販売導線のみ。決済は次フェーズで接続します。</p><a class="btn" href="mailto:?subject=営業組織設計シートについて">興味あり</a></div>
<div class="card"><div class="eyebrow">ARTICLE IDEA</div><h2>営業採用人数を売上目標から逆算する</h2><p class="muted">このテーマからSEO記事・note記事を派生させる予定。</p></div>
</div></body></html>

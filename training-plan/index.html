<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新人営業研修プラン生成</title><meta name="description" content="研修日数と重点テーマから、簡易研修プランを作ります。"><style>:root{--bg:#0f1115;--card:#171a21;--line:#2b303b;--text:#f5f7fa;--sub:#aeb6c2;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:42px 20px 70px}.eyebrow{color:var(--sub);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;margin:12px 0 18px}.lead{font-size:18px;color:var(--sub);max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button,.btn{display:inline-block;background:var(--accent);color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.result{white-space:pre-wrap;background:#0b0d11;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;min-height:56px}.price{font-size:34px;font-weight:800}.muted{color:var(--sub)}a{color:inherit}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:14px;margin-top:24px}.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}.item:hover{transform:translateY(-1px)}</style></head>
<body data-bet="010"><div class="wrap">
<div class="topnav"><a href="../index.html">← 100 BETS</a><span class="eyebrow">BET #010</span></div>
<h1>新人営業研修プラン生成</h1><p class="lead">研修日数と重点テーマから、簡易研修プランを作ります。</p>
<div class="card"><div class="eyebrow">TARGET</div><h2>営業マネージャー</h2><p class="muted">新人研修を毎回ゼロから組み直している</p></div>
<div class="card"><div class="eyebrow">FREE TOOL</div><h2>まず無料で試す</h2><div class="grid"><div class="field"><label>研修日数</label><select id="d"><option>3</option><option>5</option></select></div><div class="field"><label>重点</label><select id="f"><option>テレアポ</option><option>商談</option><option>商品知識</option></select></div></div>
<button onclick="run()">プランを作る</button><div id="r" class="result"></div>
<script>function run(){let days=+d.value,arr=[];for(let i=1;i<=days;i++){let txt=i===1?"会社・商品・顧客理解":i===days?f.value+"実践＋振り返り":f.value+"ロープレ＋フィードバック";arr.push("Day "+i+"："+txt)}r.textContent=arr.join("\n");}</script></div>
<div class="card"><div class="eyebrow">PAID PRODUCT</div><h2>新人営業研修KIT</h2><div class="price">¥4,980</div>
<p class="muted">V0.1では販売導線のみ。決済は次フェーズで接続します。</p><a class="btn" href="mailto:?subject=新人営業研修KITについて">興味あり</a></div>
<div class="card"><div class="eyebrow">ARTICLE IDEA</div><h2>新人営業研修は知識→練習→実践で組む</h2><p class="muted">このテーマからSEO記事・note記事を派生させる予定。</p></div>
</div><script src="../tracking.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>切り返しトークジェネレーター</title><meta name="description" content="代表的な断り文句から、確認→共感→再提案の骨子を作ります。"><style>:root{--bg:#0f1115;--card:#171a21;--line:#2b303b;--text:#f5f7fa;--sub:#aeb6c2;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:42px 20px 70px}.eyebrow{color:var(--sub);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;margin:12px 0 18px}.lead{font-size:18px;color:var(--sub);max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button,.btn{display:inline-block;background:var(--accent);color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.result{white-space:pre-wrap;background:#0b0d11;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;min-height:56px}.price{font-size:34px;font-weight:800}.muted{color:var(--sub)}a{color:inherit}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:14px;margin-top:24px}.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}.item:hover{transform:translateY(-1px)}</style></head>
<body><div class="wrap">
<div class="topnav"><a href="../index.html">← 100 BETS</a><span class="eyebrow">BET #007</span></div>
<h1>切り返しトークジェネレーター</h1><p class="lead">代表的な断り文句から、確認→共感→再提案の骨子を作ります。</p>
<div class="card"><div class="eyebrow">TARGET</div><h2>テレアポ担当者</h2><p class="muted">断り文句に対する返しが毎回同じになる</p></div>
<div class="card"><div class="eyebrow">FREE TOOL</div><h2>まず無料で試す</h2><div class="field"><label>断り文句</label><select id="o"><option>今は必要ない</option><option>忙しい</option><option>他社を使っている</option><option>メールで送って</option></select></div>
<button onclick="run()">切り返しを作る</button><div id="r" class="result"></div>
<script>const m={"今は必要ない":"承知しました。今すぐ切り替えというより、現状と比較した際にメリットがあるかだけ確認したいのですが、今いちばん重視されている条件は何でしょうか？","忙しい":"ありがとうございます。では長くお時間は取りません。最後に1点だけ、現在の運用で手間になっている部分はありますか？","他社を使っている":"ありがとうございます。切替前提ではなく比較だけなのですが、今のサービスで特に満足されている点はどこでしょうか？","メールで送って":"もちろんです。内容を絞りたいので1点だけ、価格・機能・運用負荷のうち、どれを優先して見たいですか？"};function run(){r.textContent=m[o.value];}</script></div>
<div class="card"><div class="eyebrow">PAID PRODUCT</div><h2>カウンタートーク集</h2><div class="price">¥2,480</div>
<p class="muted">V0.1では販売導線のみ。決済は次フェーズで接続します。</p><a class="btn" href="mailto:?subject=カウンタートーク集について">興味あり</a></div>
<div class="card"><div class="eyebrow">ARTICLE IDEA</div><h2>断り文句を否定せずに切り返す型</h2><p class="muted">このテーマからSEO記事・note記事を派生させる予定。</p></div>
</div></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>通話ログフィードバック | WORKKIT</title><style>
:root{
  --bg:#07101d;--panel:#0d1726;--panel2:#111d2e;--line:rgba(255,255,255,.09);
  --text:#f7f9fc;--muted:#98a5b7;--soft:#c7d0db;--accent:#fff;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% -10%,rgba(112,96,255,.18),transparent 28%),
    radial-gradient(circle at 88% 0%,rgba(0,198,255,.12),transparent 26%),
    var(--bg);
  line-height:1.65;
}
a{color:inherit;text-decoration:none}
.shell{max-width:1120px;margin:0 auto;padding:0 22px}
header{height:68px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8a77ff,#40d8ff);box-shadow:0 0 30px rgba(95,100,255,.28)}
.nav{display:flex;gap:18px;color:var(--muted);font-size:13px}
.hero{padding:64px 0 42px}
.hero .tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#bac4d1;font-size:11px}
h1{font-size:clamp(42px,7vw,76px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 16px}
.hero p{max-width:760px;color:var(--muted);font-size:18px}
.section{padding:26px 0 54px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:16px}
.section-head h2{margin:0;font-size:31px;letter-spacing:-.04em}
.eyebrow{font-size:11px;color:#8fa0b4;letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:20px;padding:20px;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.card h3{font-size:22px;line-height:1.18;letter-spacing:-.035em;margin:24px 0 10px}
.card p{font-size:14px;color:#aab5c5;min-height:66px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:#aeb9c8;font-size:10px}
.meta{margin-top:22px;color:#6f7c8d;font-size:11px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#07101d;font-weight:850;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;color:#fff;border:1px solid var(--line)}
footer{padding:32px 0 50px;border-top:1px solid var(--line);color:#6f7d8f;font-size:12px}
.tool-hero{padding:48px 0 24px}
.tool-hero h1{font-size:clamp(38px,6vw,64px)}
.tool-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;padding-bottom:60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 14px;font-size:22px;letter-spacing:-.03em}
.field{margin:14px 0}
.field label{display:block;color:#9eabba;font-size:12px;margin-bottom:6px}
input,textarea,select{
  width:100%;background:#08111d;border:1px solid var(--line);border-radius:11px;color:#fff;
  padding:12px 13px;font:inherit;outline:none
}
input:focus,textarea:focus,select:focus{border-color:rgba(255,255,255,.28)}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.result{display:none}
.result.show{display:block}
.score{font-size:50px;font-weight:900;letter-spacing:-.05em;margin:4px 0}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpi div{background:#08111d;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11px;color:#7e8b9c}
.callout{margin-top:14px;padding:14px;border-radius:13px;background:#08111d;border:1px solid var(--line)}
.callout strong{display:block;margin-bottom:6px}
.actions{margin-top:14px}
.actions ol{padding-left:20px;margin:8px 0}
.actions li{margin:6px 0;color:#c2ccd8}
.small{font-size:11px;color:#748296}
.copy{margin-top:10px}
.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}
.table th{color:#8e9cad;font-weight:600}
.badge-high{color:#7ef1b8}.badge-med{color:#ffd47d}.badge-low{color:#ff9898}
.related{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.related a{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#aeb9c8;font-size:11px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.tool-layout{grid-template-columns:1fr}.row4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.row,.row4{grid-template-columns:1fr}.nav{display:none}.hero{padding-top:45px}}

.utility-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.backlink{color:#c7d0db;font-size:13px;font-weight:700}
.utility-actions{display:flex;gap:8px}
.mini-btn{background:transparent;color:#aeb9c8;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer}
.mini-btn:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.result-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style></head>
<body data-bet="002">
<div class="shell">
<header>
<a class="brand" href="index.html"><span class="logo"></span><span>WORKKIT</span></a>
<nav class="nav"><a href="index.html#live">無料ツール</a><a href="index.html#soon">Coming soon</a></nav>
</header>
<div class="utility-bar">
  <a class="backlink" href="index.html">← ツール一覧へ戻る</a>
  <div class="utility-actions">
    <button class="mini-btn" onclick="history.back()">前の画面</button>
  </div>
</div>

<section class="tool-hero"><span class="pill">通話・品質</span><h1>通話ログフィードバック</h1>
<p class="small">AI APIは使わず、ブラウザ内のルール診断で「質問・課題把握・価値提示・次アクション」をチェックします。</p></section>
<div class="tool-layout">
<div class="panel"><h2>文字起こしを貼る</h2>
<div class="field"><label>通話ログ</label><textarea id="txt" placeholder="例：営業：現在はどのサービスをお使いですか？&#10;顧客：○○です。&#10;営業：ありがとうございます。今お困りの点はありますか？"></textarea></div>
<button class="btn" id="run">フィードバックする</button></div>
<div class="panel result" id="result"><span class="eyebrow">RESULT</span><div class="score"><span id="score"></span><span style="font-size:18px"> / 100</span></div>
<div class="kpi" id="metrics"></div>
<div class="callout"><strong>改善ポイント</strong><div id="advice"></div></div>
<div class="actions"><strong>次のロープレ課題</strong><ol id="tasks"></ol></div>
</div></div>
<script>
document.getElementById('run').onclick=()=>{
 const t=txt.value.trim();
 if(!t){alert('通話ログを貼ってください');return}
 if(window.BETS_TRACK) window.BETS_TRACK('tool_start',{label:'call_feedback'});
 const q=(t.match(/[?？]/g)||[]).length;
 const need=(t.match(/困|課題|悩|気になる|不便|問題|どうです|いかが/g)||[]).length;
 const value=(t.match(/できます|メリット|改善|削減|早|安|比較|シミュレーション/g)||[]).length;
 const next=(t.match(/訪問|アポ|日程|時間|伺|資料|また|次回|何時|いつ/g)||[]).length;
 const length=Math.max(t.length,1);
 const qs=Math.min(25,q*6);
 const ns=Math.min(25,need*6);
 const vs=Math.min(25,value*5);
 const xs=Math.min(25,next*6);
 const total=Math.round(qs+ns+vs+xs);
 score.textContent=total;
 metrics.innerHTML=[
  ['質問',qs],['課題把握',ns],['価値提示',vs],['次アクション',xs]
 ].map(x=>`<div><b>${x[1]}/25</b><span>${x[0]}</span></div>`).join('');
 const arr=[['質問',qs],['課題把握',ns],['価値提示',vs],['次アクション',xs]].sort((a,b)=>a[1]-b[1]);
 advice.textContent=`最も弱いのは「${arr[0][0]}」です。文字起こし上のキーワード出現を基にした簡易診断なので、実際の音声・文脈と合わせて確認してください。`;
 const tasksMap={
 '質問':['Yes/No質問を減らし、現状質問を2つ入れる','顧客の回答後に1回深掘りする','質問→回答→要約の型でロープレする'],
 '課題把握':['「今困っていること」を直接聞く','現状と理想の差を1つ言語化する','顧客の言葉を要約して返す'],
 '価値提示':['機能ではなく顧客側の変化で伝える','数字・時間・手間のどれかで価値を表現する','課題に紐づけて1つだけ提案する'],
 '次アクション':['最後に具体的な日時を聞く','「資料送付」で終わらず確認日を決める','次回の目的を一文で合意する']
 };
 tasks.innerHTML=tasksMap[arr[0][0]].map(x=>`<li>${x}</li>`).join('');
 result.classList.add('show');
 if(window.BETS_TRACK) window.BETS_TRACK('result_view',{label:arr[0][0]});
}
</script>
<footer><div>WORKKIT — practical tools for better work.</div></footer>
</div>
<script src="tracking.js"></script></body></html>

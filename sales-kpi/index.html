<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>営業KPI計算ツール</title><meta name="description" content="架電数からアポ率までを自動計算し、詰まりやすいポイントを確認します。"><style>:root{--bg:#0f1115;--card:#171a21;--line:#2b303b;--text:#f5f7fa;--sub:#aeb6c2;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:42px 20px 70px}.eyebrow{color:var(--sub);font-size:13px;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,56px);line-height:1.12;margin:12px 0 18px}.lead{font-size:18px;color:var(--sub);max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button,.btn{display:inline-block;background:var(--accent);color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none}.result{white-space:pre-wrap;background:#0b0d11;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;min-height:56px}.price{font-size:34px;font-weight:800}.muted{color:var(--sub)}a{color:inherit}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:14px;margin-top:24px}.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}.item:hover{transform:translateY(-1px)}</style></head>
<body><div class="wrap">
<div class="topnav"><a href="../index.html">← 100 BETS</a><span class="eyebrow">BET #001</span></div>
<h1>営業KPI計算ツール</h1><p class="lead">架電数からアポ率までを自動計算し、詰まりやすいポイントを確認します。</p>
<div class="card"><div class="eyebrow">TARGET</div><h2>営業マネージャー</h2><p class="muted">架電→接続→有効会話→アポのどこが弱いか一瞬で見たい</p></div>
<div class="card"><div class="eyebrow">FREE TOOL</div><h2>まず無料で試す</h2><div class="grid">
<div class="field"><label>架電数</label><input id="a" type="number" value="250"></div>
<div class="field"><label>接続数</label><input id="b" type="number" value="100"></div>
<div class="field"><label>有効会話数</label><input id="c" type="number" value="20"></div>
<div class="field"><label>アポ数</label><input id="d" type="number" value="4"></div></div>
<button onclick="run()">計算する</button><div id="r" class="result"></div>
<script>function pct(x,y){return y?((x/y)*100).toFixed(1):"0.0"}function run(){document.getElementById("r").textContent="接続率："+pct(+b.value,+a.value)+"%\n有効会話率："+pct(+c.value,+b.value)+"%\n有効会話→アポ率："+pct(+d.value,+c.value)+"%\n架電→アポ率："+pct(+d.value,+a.value)+"%";}</script></div>
<div class="card"><div class="eyebrow">PAID PRODUCT</div><h2>営業KPI管理シート</h2><div class="price">¥2,980</div>
<p class="muted">V0.1では販売導線のみ。決済は次フェーズで接続します。</p><a class="btn" href="mailto:?subject=営業KPI管理シートについて">興味あり</a></div>
<div class="card"><div class="eyebrow">ARTICLE IDEA</div><h2>営業KPIは件数ではなくファネルで見る</h2><p class="muted">このテーマからSEO記事・note記事を派生させる予定。</p></div>
</div></body></html>
